[project]
name = "drone-mocap"
version = "0.1.0"
description = "Dual-drone markerless motion capture system for 3D biomechanical analysis"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "mediapipe",
    "opencv-python",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyinstaller",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]