[project]
name = "drone-mocap"
version = "1.2.0"
description = "Sagittal markerless motion capture — 2D kinematic extraction from video"
authors = [{ name = "DroCap Capstone Team" }]
readme = "README.md"
requires-python = "~=3.11.0"
dependencies = [
    "mediapipe==0.10.14",
    "jax==0.4.20",
    "jaxlib==0.4.20",
    "opencv-python",
    "numpy>=1.26.0,<2.0.0",
    "pandas",
    "scipy",
    "pyarrow",
    "matplotlib",
    "typer[all]",
    "rich",
]

[project.scripts]
drone-mocap = "drone_mocap.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_mocap"]